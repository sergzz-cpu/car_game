<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Мини-гонки — Обгони всех!</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#101827;color:white;font-family:system-ui,-apple-system,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}.shell{width:min(460px,100%);text-align:center}h1{margin:0 0 7px;font-size:clamp(24px,5vw,34px)}p{margin:0 0 12px;color:#aebbd0;font-size:14px}.top{display:flex;gap:10px;justify-content:space-between;margin-bottom:10px}.pill{background:#26344d;padding:9px 15px;border-radius:12px;font-weight:700}canvas{width:100%;height:auto;aspect-ratio:3/4.3;background:#252d3b;border:3px solid #56627a;border-radius:18px;display:block;touch-action:none}.controls{display:flex;gap:12px;margin-top:12px}button{border:0;border-radius:13px;color:#fff;background:#2563eb;font-weight:800;font-size:18px;padding:14px;cursor:pointer;touch-action:none;user-select:none}.controls button{flex:1;font-size:25px;background:#33496e}#start{width:100%;margin-top:12px;background:#16a34a}small{display:block;margin-top:9px;color:#aebbd0}
</style>
</head>
<body><main class="shell"><h1>🏎️ Мини-гонки</h1><p>Уворачивайся от машин и набирай очки!</p><div class="top"><div class="pill">⭐ Очки: <span id="score">0</span></div><div class="pill">🏆 Рекорд: <span id="best">0</span></div></div><canvas id="game" width="360" height="516" aria-label="Поле автомобильной игры"></canvas><div class="controls"><button id="left" aria-label="Влево">⬅️</button><button id="right" aria-label="Вправо">➡️</button></div><button id="start">▶ Начать игру</button><small>Управление: ← → или A / D · На телефоне — кнопками</small></main>
<script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),start=document.getElementById('start');const W=c.width,H=c.height,road={x:48,w:264},car={w:42,h:76,y:H-104,x:W/2-21};let enemies=[],score=0,best=0,playing=false,last=0,spawn=0,scroll=0,raf=0;const keys={left:false,right:false};try{best=Number(localStorage.getItem('carGameBest'))||0}catch{}bestEl.textContent=best;
function vehicle(x,y,w,h,color,player=false){ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(4,7,w,h);ctx.fillStyle='#131923';ctx.fillRect(-5,12,8,18);ctx.fillRect(w-3,12,8,18);ctx.fillRect(-5,h-28,8,18);ctx.fillRect(w-3,h-28,8,18);ctx.fillStyle=color;round(0,0,w,h,10);ctx.fill();ctx.fillStyle=player?'#bceeff':'#a6ccde';round(7,12,w-14,17,5);ctx.fill();round(7,h-29,w-14,15,5);ctx.fill();ctx.fillStyle=player?'#fff3a8':'#f66767';ctx.fillRect(6,2,10,5);ctx.fillRect(w-16,2,10,5);ctx.fillStyle=player?'#fa5555':'#fff1b0';ctx.fillRect(6,h-7,10,5);ctx.fillRect(w-16,h-7,10,5);ctx.restore()}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function draw(){ctx.fillStyle='#218358';ctx.fillRect(0,0,W,H);for(let y=-50+(scroll%55);y<H;y+=55){ctx.fillStyle='#2b9566';ctx.fillRect(10,y,24,29);ctx.fillRect(W-34,y+13,24,29)}ctx.fillStyle='#303746';ctx.fillRect(road.x,0,road.w,H);ctx.fillStyle='#f9f8f0';ctx.fillRect(road.x+4,0,4,H);ctx.fillRect(road.x+road.w-8,0,4,H);ctx.fillStyle='#e7edf6';for(let lane=1;lane<=2;lane++)for(let y=-52+(scroll%78);y<H;y+=78)ctx.fillRect(road.x+road.w*lane/3-3,y,6,39);enemies.forEach(e=>vehicle(e.x,e.y,e.w,e.h,e.color));vehicle(car.x,car.y,car.w,car.h,'#2596fa',true);if(!playing){ctx.fillStyle='rgba(10,18,31,.75)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 28px system-ui';ctx.fillText(score?'Авария! 💥':'Готов к гонке? 🏁',W/2,H/2-25);ctx.font='17px system-ui';ctx.fillText(score?'Твой результат: '+Math.floor(score):'Жми «Начать игру»',W/2,H/2+12)}}
function reset(){cancelAnimationFrame(raf);enemies=[];score=0;spawn=0;scroll=0;car.x=W/2-car.w/2;scoreEl.textContent=0;last=0;playing=true;start.textContent='↻ Начать заново';raf=requestAnimationFrame(tick)}function finish(){playing=false;let n=Math.floor(score);if(n>best){best=n;bestEl.textContent=best;try{localStorage.setItem('carGameBest',best)}catch{}}start.textContent='↻ Играть снова';draw()}
function tick(t){if(!playing)return;const dt=Math.min((t-(last||t))/16.67,2.3);last=t;const speed=4+Math.min(score/180,5);scroll+=speed*dt;const step=6.4*dt;if(keys.left)car.x-=step;if(keys.right)car.x+=step;car.x=Math.max(road.x+12,Math.min(road.x+road.w-12-car.w,car.x));spawn+=dt;if(spawn>Math.max(25,70-score/20)){spawn=0;let lane=Math.floor(Math.random()*3);let w=42,h=72;let x=road.x+road.w*(lane+.5)/3-w/2;if(!enemies.some(e=>e.y<115&&Math.abs(e.x-x)<35))enemies.push({x,y:-h,w,h,color:['#f34c56','#f8b943','#9968ef','#48d1bb'][Math.floor(Math.random()*4)]})}for(let e of enemies){e.y+=(speed+1.2)*dt;if(car.x+car.w-8>e.x+8&&car.x+8<e.x+e.w-8&&car.y+car.h-9>e.y+9&&car.y+9<e.y+e.h-9){finish();return}}enemies=enemies.filter(e=>e.y<H+90);score+=dt*.2;scoreEl.textContent=Math.floor(score);draw();raf=requestAnimationFrame(tick)}
function setKey(k,value){if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=value;if(k==='ArrowRight'||k==='d'||k==='D')keys.right=value}document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key)){e.preventDefault();setKey(e.key,true)}});document.addEventListener('keyup',e=>setKey(e.key,false));window.addEventListener('blur',()=>{keys.left=false;keys.right=false});for(let side of ['left','right']){let btn=document.getElementById(side);btn.addEventListener('pointerdown',e=>{e.preventDefault();keys[side]=true;btn.setPointerCapture(e.pointerId)});for(let event of ['pointerup','pointercancel','lostpointercapture'])btn.addEventListener(event,()=>keys[side]=false)}start.addEventListener('click',reset);draw()})();
</script></body></html>
